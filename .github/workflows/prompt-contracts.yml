name: Prompt Contracts

on:
  pull_request:
    paths:
      - "prompts/**"
      - "tests/prompt-evals/**"
      - "tests/prompt_contract_tests.rs"
      - "tests/prompt_eval_contract_tests.rs"
      - "scripts/prompt-evals/**"
      - ".github/workflows/prompt-evaluator.md"
      - ".github/workflows/prompt-evaluator.lock.yml"
      - ".github/workflows/prompt-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Prompt Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Run prompt contract tests
        run: cargo test --test prompt_contract_tests --test prompt_eval_contract_tests

      - name: Run prompt evaluator tests
        run: node --test scripts/prompt-evals/test/*.test.mjs

      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@ba6380cc6e5be5d21677bebe04d52fb48e3abec7 # v0.81.6
        with:
          version: v0.81.6

      - name: Compile prompt evaluator strictly
        run: |
          set -euo pipefail
          gh aw compile prompt-evaluator --strict
          git diff --exit-code -- .github/workflows/prompt-evaluator.lock.yml

